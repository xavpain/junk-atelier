<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Junk Atelier: a junk/paint bin with paint inside -->
  <defs>
    <linearGradient id="bin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a4a"/>
      <stop offset="1" stop-color="#15151f"/>
    </linearGradient>
  </defs>
  <!-- paint blobs spilling over the rim -->
  <path d="M12 14c2-5 8-6 11-3 2-4 9-3 10 1 3 0 4 3 2 5H11c-1.5-1-1-2 1-3z" fill="#7e14ff"/>
  <ellipse cx="19" cy="11" rx="4.5" ry="3.5" fill="#47bfff"/>
  <ellipse cx="30" cy="12" rx="4" ry="3" fill="#ff5b8a"/>
  <circle cx="24" cy="9" r="2.6" fill="#ffd23f"/>
  <!-- drip -->
  <path d="M33 16c0 3-3 4-3 7 0 2 3 2 3 0 0-3 1-4 1-7z" fill="#ff5b8a"/>
  <!-- bin body -->
  <path d="M10 16h28l-3 26a3 3 0 0 1-3 2.6H16a3 3 0 0 1-3-2.6L10 16z" fill="url(#bin)" stroke="#0a0a12" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- rim -->
  <rect x="8" y="13" width="32" height="5" rx="2.5" fill="#2a2a38" stroke="#0a0a12" stroke-width="1.5"/>
  <!-- vertical ridges -->
  <path d="M19 20l-1 21M24 20v21M29 20l1 21" stroke="#52526a" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</svg>
